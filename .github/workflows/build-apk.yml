name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        # Generates the android/ folder. Existing files such as lib/ and pubspec.yaml are kept.
        run: flutter create --platforms=android --project-name household_app --org com.gharbaar .

      - name: Add Firebase config and fixed signing key
        # Same signing key on every build, so the APK keeps the same fingerprint for Google sign-in.
        run: |
          cp firebase/google-services.json android/app/google-services.json
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Add diagnostic channel (reads the app's signing key)
        run: |
          DIR=android/app/src/main/kotlin/com/gharbaar/household_app
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.kt" <<'KT'
          package com.gharbaar.household_app

          import android.content.pm.PackageManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.security.MessageDigest

          class MainActivity : FlutterFragmentActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "gharbaar/diag")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "signingSha1") result.success(signingSha1())
                          else result.notImplemented()
                      }
              }

              private fun signingSha1(): String {
                  if (Build.VERSION.SDK_INT < 28) return "needs Android 9 or newer"
                  return try {
                      val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                      val signers = info.signingInfo?.apkContentsSigners ?: return "none"
                      signers.joinToString(", ") { sig ->
                          MessageDigest.getInstance("SHA-1").digest(sig.toByteArray())
                              .joinToString(":") { "%02X".format(it) }
                      }
                  } catch (e: Exception) {
                      "error: " + e.toString()
                  }
              }
          }
          KT

      - name: Enable fingerprint sign-in in Android project
        run: |
          python3 - <<'PY'
          import pathlib, re
          # Permission for the fingerprint prompt.
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'USE_BIOMETRIC' not in m:
              m = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />', m, count=1)
              manifest.write_text(m)
          # The fingerprint prompt needs a FragmentActivity instead of a plain FlutterActivity.
          for f in pathlib.Path('android/app/src/main').rglob('MainActivity.*'):
              t = f.read_text()
              t = t.replace('io.flutter.embedding.android.FlutterActivity', 'io.flutter.embedding.android.FlutterFragmentActivity')
              t = t.replace(': FlutterActivity()', ': FlutterFragmentActivity()')
              t = t.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
              f.write_text(t)
          # Name shown under the app icon on the phone.
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = re.sub(r'(<application[^>]*android:label=")[^"]*(")', r'\1Gharbaar\2', m, count=1)
          manifest.write_text(m)
          # local_auth needs Android 6.0 (API 23) or newer.
          for f in pathlib.Path('android/app').glob('build.gradle*'):
              t = f.read_text()
              t = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', t)
              t = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', t)
              f.write_text(t)
          # Firebase: the Google services plugin reads google-services.json.
          for f in pathlib.Path('android').glob('settings.gradle*'):
              t = f.read_text()
              if 'google-services' not in t:
                  line = ('    id("com.google.gms.google-services") version "4.4.2" apply false' if f.suffix == '.kts'
                          else "    id 'com.google.gms.google-services' version '4.4.2' apply false")
                  t = t.replace('plugins {', 'plugins {\n' + line, 1)
                  f.write_text(t)
          for f in pathlib.Path('android/app').glob('build.gradle*'):
              t = f.read_text()
              if 'google-services' not in t:
                  line = ('    id("com.google.gms.google-services")' if f.suffix == '.kts'
                          else "    id 'com.google.gms.google-services'")
                  t = t.replace('plugins {', 'plugins {\n' + line, 1)
                  f.write_text(t)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Print signing certificates
        run: |
          echo "--- APK signed with:"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk || true
          echo "--- Keystore in repo:"
          keytool -list -v -keystore android-signing/debug.keystore -storepass android | grep SHA1 || true

      - name: Collect APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/Gharbaar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gharbaar-apk
          path: out/Gharbaar.apk
