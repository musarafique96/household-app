name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        # Generates the android/ folder. Existing files such as lib/ and pubspec.yaml are kept.
        run: flutter create --platforms=android --project-name household_app --org com.household .

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Collect APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/HouseholdApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HouseholdApp-apk
          path: out/HouseholdApp.apk
