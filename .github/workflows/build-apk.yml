name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        # Generates the android/ folder. Existing files such as lib/ and pubspec.yaml are kept.
        run: flutter create --platforms=android --project-name household_app --org com.household .

      - name: Enable fingerprint sign-in in Android project
        run: |
          python3 - <<'PY'
          import pathlib, re
          # Permission for the fingerprint prompt.
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'USE_BIOMETRIC' not in m:
              m = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />', m, count=1)
              manifest.write_text(m)
          # The fingerprint prompt needs a FragmentActivity instead of a plain FlutterActivity.
          for f in pathlib.Path('android/app/src/main').rglob('MainActivity.*'):
              t = f.read_text()
              t = t.replace('io.flutter.embedding.android.FlutterActivity', 'io.flutter.embedding.android.FlutterFragmentActivity')
              t = t.replace(': FlutterActivity()', ': FlutterFragmentActivity()')
              t = t.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
              f.write_text(t)
          # Name shown under the app icon on the phone.
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = re.sub(r'(<application[^>]*android:label=")[^"]*(")', r'\1Gharbaar\2', m, count=1)
          manifest.write_text(m)
          # local_auth needs Android 6.0 (API 23) or newer.
          for f in pathlib.Path('android/app').glob('build.gradle*'):
              t = f.read_text()
              t = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', t)
              t = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', t)
              f.write_text(t)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Collect APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/Gharbaar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gharbaar-apk
          path: out/Gharbaar.apk
