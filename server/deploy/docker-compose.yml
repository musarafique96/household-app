services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gharbaar
      POSTGRES_USER: gharbaar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs the SQL files once, on first start of an empty database volume.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gharbaar -d gharbaar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Db__Host: postgres
      Db__Name: gharbaar
      Db__User: gharbaar
      Db__PasswordFile: /run/secrets/db_password
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in server/deploy/.env}
      Jwt__Issuer: gharbaar
      Google__ClientId: 360184901967-lr5k1vrvvjk7s5ikj3qia8i4f5225iko.apps.googleusercontent.com
      # Caddy's fixed address on the shared edge network (set in server-infra). Only it may set the client address.
      TrustedProxies__0: 172.30.0.2
    secrets:
      - db_password
    networks:
      default: {}
      edge:
        aliases: [gharbaar-api]

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:

# Caddy and public routing live in server-infra. This network is created there.
networks:
  edge:
    external: true
